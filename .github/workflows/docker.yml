name: tests en image

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # De twee images apart, zodat de lichte brug niet hoeft te wachten op de
      # browser-container - die is ruim een gigabyte en duurt een paar minuten.
      fail-fast: false
      matrix:
        include:
          - naam: brug
            suffix: ""
            context: "."
          - naam: browser-container
            suffix: "-renderer"
            context: "./renderer"
    name: image (${{ matrix.naam }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          # Een pull request bouwt wel, maar pusht niets.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Eigen cache per image, anders overschrijven ze elkaar.
          cache-from: type=gha,scope=${{ matrix.naam }}
          cache-to: type=gha,mode=max,scope=${{ matrix.naam }}
