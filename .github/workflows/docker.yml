name: tests en image

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # De twee images apart, zodat de lichte brug niet hoeft te wachten op de
      # browser-container - die is ruim een gigabyte en duurt een paar minuten.
      fail-fast: false
      matrix:
        include:
          - naam: brug
            suffix: ""
            context: "."
            poort: 8095
          - naam: browser-container
            suffix: "-renderer"
            context: "./renderer"
            poort: 8096
    name: image (${{ matrix.naam }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}

      # Eerst lokaal bouwen en écht starten, vóór er iets gepusht wordt. Een
      # image dat bouwt maar niet opstart is hier al voorgekomen: de
      # browser-container miste een COPY van app.py, en daar merkt een
      # geslaagde build niets van - hij viel pas om in een herstartlus op de
      # NAS.
      - name: bouwen en lokaal laden
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          tags: proef:lokaal
          cache-from: type=gha,scope=${{ matrix.naam }}
          cache-to: type=gha,mode=max,scope=${{ matrix.naam }}

      - name: starten en /healthz opvragen
        run: |
          docker run -d --name proef \
            -e TANDOOR_URL=http://127.0.0.1:1 \
            -e TANDOOR_TOKEN=tda_alleen_voor_ci \
            -p ${{ matrix.poort }}:${{ matrix.poort }} \
            proef:lokaal
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${{ matrix.poort }}/healthz" > /dev/null; then
              echo "healthz antwoordt"
              docker rm -f proef > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "het image start niet op; logboek:"
          docker logs proef
          docker rm -f proef > /dev/null
          exit 1

      # Pas nu pushen. De cache is al warm, dus dit kost seconden.
      - name: pushen
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          # Een pull request bouwt en test wel, maar pusht niets.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.naam }}
